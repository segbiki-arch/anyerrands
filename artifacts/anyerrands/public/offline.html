<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AnyErrands — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0D0D0D;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 380px; }
      .mark {
        width: 88px; height: 88px; border-radius: 22px;
        margin: 0 auto 24px; display: block;
      }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #b3b3b3; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button {
        background: #F5C400; color: #0D0D0D; border: 0;
        font-weight: 800; font-size: 15px; padding: 13px 28px;
        border-radius: 999px; cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="/icons/icon-192.png" alt="AnyErrands" />
      <h1>You're offline</h1>
      <p>AnyErrands needs an internet connection to load. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
