openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AnyErrands API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: errands
    description: Errand operations
  - name: helpers
    description: Helper profile operations
  - name: categories
    description: Errand category operations
  - name: notifications
    description: Notification operations
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /errands:
    get:
      operationId: listErrands
      tags: [errands]
      summary: List all errands
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, accepted, completed]
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of errands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Errand"
    post:
      operationId: createErrand
      tags: [errands]
      summary: Post a new errand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrandInput"
      responses:
        "201":
          description: Errand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errand"
        "400":
          description: Invalid input

  /errands/{id}:
    get:
      operationId: getErrand
      tags: [errands]
      summary: Get errand by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Errand details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errand"
        "404":
          description: Not found
    patch:
      operationId: updateErrand
      tags: [errands]
      summary: Update an errand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrandUpdate"
      responses:
        "200":
          description: Updated errand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errand"
        "404":
          description: Not found
    delete:
      operationId: deleteErrand
      tags: [errands]
      summary: Delete an errand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /errands/{id}/accept:
    post:
      operationId: acceptErrand
      tags: [errands]
      summary: Accept an errand as a helper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptErrandInput"
      responses:
        "200":
          description: Errand accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errand"
        "404":
          description: Not found

  /errands/{id}/complete:
    post:
      operationId: completeErrand
      tags: [errands]
      summary: Mark an errand as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Errand completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errand"
        "404":
          description: Not found

  /errands/stats/summary:
    get:
      operationId: getErrandStats
      tags: [errands]
      summary: Get aggregate errand statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandStats"

  /errands/recent:
    get:
      operationId: getRecentErrands
      tags: [errands]
      summary: Get recently posted errands
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent errands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Errand"

  /helpers:
    get:
      operationId: listHelpers
      tags: [helpers]
      summary: List available helpers
      responses:
        "200":
          description: List of helpers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Helper"
    post:
      operationId: createHelper
      tags: [helpers]
      summary: Register as a helper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperInput"
      responses:
        "201":
          description: Helper profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Helper"

  /helpers/{id}:
    get:
      operationId: getHelper
      tags: [helpers]
      summary: Get helper profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Helper profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Helper"
        "404":
          description: Not found
    patch:
      operationId: updateHelper
      tags: [helpers]
      summary: Update helper profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperUpdate"
      responses:
        "200":
          description: Updated helper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Helper"

  /helpers/{id}/errands:
    get:
      operationId: getHelperErrands
      tags: [helpers]
      summary: Get errands accepted by a helper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Helper's errands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Errand"

  /stripe/connect/onboard/{helperId}:
    post:
      operationId: stripeConnectOnboard
      tags: [helpers]
      summary: Start Stripe Connect onboarding for a helper
      parameters:
        - name: helperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Onboarding URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectOnboardResponse"
        "404":
          description: Helper not found

  /stripe/connect/manage/{helperId}:
    post:
      operationId: stripeConnectManage
      tags: [helpers]
      summary: Get a Stripe Express dashboard link for a connected helper to update bank details
      parameters:
        - name: helperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectOnboardResponse"
        "400":
          description: Helper has no connected account yet
        "404":
          description: Helper not found

  /stripe/connect/status/{helperId}:
    get:
      operationId: stripeConnectStatus
      tags: [helpers]
      summary: Get Stripe Connect account status for a helper
      parameters:
        - name: helperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connect account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectStatusResponse"
        "404":
          description: Helper not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List errand categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /errands/{id}/report:
    post:
      operationId: reportHelper
      tags: [errands]
      summary: Report a helper for an errand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportHelperInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid input or errand not in reportable state
        "404":
          description: Errand not found

  /admin/reports:
    get:
      operationId: listReports
      tags: [admin]
      summary: List all reports (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, reviewed, resolved]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportWithContext"

  /admin/reports/{id}:
    patch:
      operationId: updateReportStatus
      tags: [admin]
      summary: Update a report status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportWithContext"
        "404":
          description: Report not found

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a helper
      parameters:
        - name: helperId
          in: query
          required: false
          schema:
            type: integer
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found

  /notifications/mark-all-read:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read for a helper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helperId]
              properties:
                helperId:
                  type: integer
      responses:
        "200":
          description: Count of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Errand:
      type: object
      required: [id, title, description, category, status, requesterName, requesterLocation, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [open, accepted, completed]
        requesterName:
          type: string
        requesterLocation:
          type: string
        requesterAddress:
          type: ["string", "null"]
        requesterPhone:
          type: ["string", "null"]
        estimatedDuration:
          type: ["string", "null"]
        budgetAmount:
          type: ["number", "null"]
        helperId:
          type: ["integer", "null"]
        helperName:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [unpaid, paid, refunded]
        paidAmount:
          type: ["number", "null"]
        platformFee:
          type: ["number", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ErrandInput:
      type: object
      required: [title, description, category, requesterName, requesterLocation]
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 10
        category:
          type: string
        requesterName:
          type: string
        requesterLocation:
          type: string
        requesterAddress:
          type: string
        requesterPhone:
          type: string
        estimatedDuration:
          type: string
        budgetAmount:
          type: number

    ErrandUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        requesterLocation:
          type: string
        estimatedDuration:
          type: string
        budgetAmount:
          type: number
        status:
          type: string
          enum: [open, accepted, completed]

    AcceptErrandInput:
      type: object
      required: [helperId]
      properties:
        helperId:
          type: integer

    ErrandStats:
      type: object
      required: [totalOpen, totalAccepted, totalCompleted, totalErrands, topCategory]
      properties:
        totalOpen:
          type: integer
        totalAccepted:
          type: integer
        totalCompleted:
          type: integer
        totalErrands:
          type: integer
        topCategory:
          type: ["string", "null"]

    Helper:
      type: object
      required: [id, name, location, bio, skills, errandsCompleted, rating, available, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        errandsCompleted:
          type: integer
        rating:
          type: ["number", "null"]
        available:
          type: boolean
        avatarInitials:
          type: ["string", "null"]
        stripeAccountId:
          type: ["string", "null"]
        stripeOnboardingComplete:
          type: ["boolean", "null"]
        createdAt:
          type: string

    StripeConnectOnboardResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    StripeConnectStatusResponse:
      type: object
      required: [connected, detailsSubmitted, chargesEnabled]
      properties:
        connected:
          type: boolean
        detailsSubmitted:
          type: boolean
        chargesEnabled:
          type: boolean
        accountId:
          type: ["string", "null"]

    HelperInput:
      type: object
      required: [name, location, bio, skills]
      properties:
        name:
          type: string
        location:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        available:
          type: boolean

    HelperUpdate:
      type: object
      properties:
        bio:
          type: string
        location:
          type: string
        skills:
          type: array
          items:
            type: string
        available:
          type: boolean
        rating:
          type: number

    Category:
      type: object
      required: [id, name, icon, description]
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
        description:
          type: string

    ReportHelperInput:
      type: object
      required: [reporterName, reason, description]
      properties:
        reporterName:
          type: string
          minLength: 2
        reason:
          type: string
          enum: [work_not_done, work_poor_quality, no_show, late, other]
        description:
          type: string
          minLength: 10

    Report:
      type: object
      required: [id, errandId, helperId, reporterName, reason, description, status, createdAt]
      properties:
        id:
          type: integer
        errandId:
          type: integer
        helperId:
          type: integer
        reporterName:
          type: string
        reason:
          type: string
          enum: [work_not_done, work_poor_quality, no_show, late, other]
        description:
          type: string
        status:
          type: string
          enum: [pending, reviewed, resolved]
        createdAt:
          type: string

    UpdateReportStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, reviewed, resolved]

    ReportWithContext:
      type: object
      required: [id, errandId, helperId, reporterName, reason, description, status, createdAt]
      properties:
        id:
          type: integer
        errandId:
          type: integer
        helperId:
          type: integer
        reporterName:
          type: string
        reason:
          type: string
          enum: [work_not_done, work_poor_quality, no_show, late, other]
        description:
          type: string
        status:
          type: string
          enum: [pending, reviewed, resolved]
        createdAt:
          type: string
        errandTitle:
          type: string
        helperName:
          type: string

    Notification:
      type: object
      required: [id, helperId, errandId, message, read, createdAt]
      properties:
        id:
          type: integer
        helperId:
          type: integer
        errandId:
          type: integer
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
